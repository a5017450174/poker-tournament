<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>德撲錦標賽 — 多人連線</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0d10; --panel:#141a20; --panel-2:#1a2128;
    --felt-1:#0a4a2a; --felt-2:#0e6438; --felt-edge:#1f2a32;
    --text:#f3efe3; --text-dim:#9aa3ab; --text-mute:#6b7480;
    --gold:#e7b53b; --gold-2:#c69a2a;
    --red:#e23b3b; --green:#3bd47a; --blue:#4a9eff;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",PingFang TC,Helvetica,Arial,sans-serif}
  body{overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:disabled{cursor:not-allowed;opacity:.4}
  input{font-family:inherit;background:var(--panel);border:1px solid var(--felt-edge);color:var(--text);padding:8px 12px;border-radius:6px;font-size:14px}
  input:focus{outline:none;border-color:var(--gold)}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:24px}
  .hidden{display:none!important}

  /* 連線狀態 */
  .conn-state{position:fixed;top:8px;right:8px;font-size:11px;color:var(--text-mute);padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.5);z-index:99;letter-spacing:1px}
  .conn-state.ok{color:var(--green)}
  .conn-state.bad{color:var(--red)}

  /* ===== Lobby ===== */
  #lobby{align-items:center;justify-content:flex-start;background:radial-gradient(ellipse at top,#1a2530 0%,#0a0d10 60%);overflow-y:auto}
  #lobby > .lobby-title{flex-shrink:0}
  #lobby > .lobby-card{flex-shrink:0;margin:auto 0}
  .lobby-title{font-size:42px;font-weight:800;letter-spacing:4px;margin-bottom:8px;text-align:center}
  .lobby-title .gold{color:var(--gold)}
  .lobby-sub{color:var(--text-dim);text-align:center;margin-bottom:32px;letter-spacing:2px}

  .lobby-card{background:var(--panel);border:1px solid var(--felt-edge);border-radius:12px;padding:32px 40px;width:min(520px,100%);box-shadow:0 8px 32px rgba(0,0,0,.5)}
  .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .form-row label{font-size:12px;color:var(--text-dim);letter-spacing:2px}
  .form-row input{font-size:15px;padding:10px 14px}

  .lobby-actions{display:flex;gap:10px;margin-top:18px}
  .lobby-actions button{flex:1;padding:14px;font-size:15px;font-weight:700;letter-spacing:3px;border-radius:8px}
  .lobby-actions button.primary{background:var(--gold);color:#000}
  .lobby-actions button.primary:hover{background:#fcc847}
  .lobby-actions button.secondary{background:var(--panel-2);border:1px solid var(--felt-edge);color:var(--text)}
  .lobby-actions button.secondary:hover{border-color:var(--gold);color:var(--gold)}

  .toggle-form{display:flex;gap:8px;margin-bottom:18px;justify-content:center}
  .toggle-form button{padding:8px 18px;background:var(--panel-2);border:1px solid var(--felt-edge);color:var(--text-dim);border-radius:6px;font-size:13px;letter-spacing:2px}
  .toggle-form button.active{background:var(--gold);color:#000;border-color:var(--gold)}

  .room-settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .room-settings .form-row{margin-bottom:0}

  /* ===== Waiting Room ===== */
  #wait{align-items:center;justify-content:flex-start;background:radial-gradient(ellipse at top,#1a2530 0%,#0a0d10 60%);overflow-y:auto;padding-top:24px;padding-bottom:24px}
  .wait-card{background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:24px 36px;text-align:center;width:min(640px,100%);margin:auto 0;flex-shrink:0}
  .wait-code{font-size:48px;font-weight:900;color:var(--gold);letter-spacing:12px;background:rgba(0,0,0,.5);padding:16px 28px;border-radius:10px;margin:14px 0;font-family:Menlo,Consolas,monospace}
  .wait-hint{color:var(--text-dim);font-size:13px;letter-spacing:2px;margin-bottom:18px}
  .wait-players{margin:18px 0;display:flex;flex-direction:column;gap:6px}
  .wait-player{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(255,255,255,.03);border-radius:6px;font-size:14px}
  .wait-player .ico{font-size:18px}
  .wait-player.host .name::after{content:" (房主)";color:var(--gold);font-size:11px;margin-left:4px}
  .wait-player .name{flex:1;text-align:left}
  .wait-player .you{background:var(--gold);color:#000;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800}

  .wait-actions{display:flex;gap:10px;margin-top:18px}
  .wait-actions button{flex:1;padding:12px;font-weight:700;letter-spacing:3px;border-radius:8px;font-size:14px}
  .wait-actions .start{background:var(--gold);color:#000}
  .wait-actions .start:hover{background:#fcc847}
  .wait-actions .leave{background:var(--panel-2);border:1px solid var(--felt-edge);color:var(--text-dim)}
  .wait-actions .leave:hover{color:var(--red);border-color:var(--red)}

  .copy-btn{padding:6px 12px;background:var(--panel-2);border:1px solid var(--felt-edge);color:var(--text);border-radius:5px;font-size:12px;letter-spacing:1px;margin-left:8px}
  .copy-btn:hover{border-color:var(--gold);color:var(--gold)}

  /* ===== Game Screen ===== */
  #game{flex-direction:row;padding:0}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{background:var(--panel);border-bottom:1px solid var(--felt-edge);padding:10px 18px;display:flex;align-items:center;gap:24px;flex-shrink:0}
  .info-block{display:flex;flex-direction:column;line-height:1.2}
  .info-block .lbl{font-size:10px;color:var(--text-mute);letter-spacing:1px;text-transform:uppercase}
  .info-block .val{font-size:16px;font-weight:600}
  .info-block .val.gold{color:var(--gold)}
  .timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;color:var(--gold)}
  .topbar .right{margin-left:auto;display:flex;gap:8px}
  .topbar button.icon{padding:6px 12px;border:1px solid var(--felt-edge);border-radius:6px;font-size:12px;color:var(--text-dim)}
  .topbar button.icon:hover{border-color:var(--red);color:var(--red)}

  .table-wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:40px 30px 140px;min-height:0}
  .felt{position:relative;width:min(100%,1100px);aspect-ratio:1.7/1;max-height:calc(100vh - 240px);background:radial-gradient(ellipse at center,var(--felt-2) 0%,var(--felt-1) 60%,#063a20 100%);border:8px solid #2a1a0e;border-radius:50%/50%;box-shadow:inset 0 0 60px rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.6)}
  .felt::before{content:"";position:absolute;inset:14px;border:2px solid rgba(231,181,59,.15);border-radius:inherit;pointer-events:none}

  .center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px;width:80%}
  .pot{display:flex;flex-direction:column;align-items:center;gap:4px}
  .pot .lbl{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:2px}
  .pot .val{font-size:22px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
  .community{display:flex;gap:8px;min-height:96px}

  .card{width:60px;height:84px;background:#fafaf2;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.3);font-weight:700;color:#222;user-select:none}
  .card.s,.card.c{color:#1a1a1a}
  .card.h,.card.d{color:#c93030}
  .card .r{font-size:22px;line-height:1}
  .card .s{font-size:22px;line-height:1;margin-top:2px}
  .card.placeholder{background:rgba(0,0,0,.18);box-shadow:none;border:1.5px dashed rgba(255,255,255,.12)}
  .card.back{background:linear-gradient(135deg,#7c1e1e 0%,#a02b2b 50%,#7c1e1e 100%);position:relative}
  .card.back::after{content:"";position:absolute;inset:6px;border:1.5px solid rgba(255,255,255,.25);border-radius:4px}
  .card.small{width:42px;height:60px}
  .card.small .r,.card.small .s{font-size:15px}
  .card.matched{box-shadow:0 0 0 4px var(--gold),0 0 30px var(--gold)!important;z-index:5;animation:matchPulse .55s ease-in-out infinite alternate}
  @keyframes matchPulse{
    from{transform:translateY(-6px) scale(1.05)}
    to{transform:translateY(-10px) scale(1.10)}
  }

  .seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;width:140px;transition:opacity .3s}
  .seat .avatar{width:54px;height:54px;border-radius:50%;background:var(--panel);border:2px solid var(--felt-edge);display:flex;align-items:center;justify-content:center;font-size:22px;transition:all .3s}
  .seat.active .avatar{border-color:var(--gold);box-shadow:0 0 0 3px rgba(231,181,59,.3),0 0 24px rgba(231,181,59,.5);transform:scale(1.15)}
  .seat .name-plate{background:rgba(0,0,0,.55);padding:4px 10px;border-radius:6px;display:flex;flex-direction:column;align-items:center;min-width:100px;border:1px solid rgba(255,255,255,.06)}
  .seat .name{font-size:12px;font-weight:600}
  .seat.you .name{color:var(--gold)}
  .seat .chips{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
  .seat.eliminated{opacity:.3;filter:grayscale(1)}
  .seat.folded{opacity:.42;filter:grayscale(.85)}
  .seat .hole{display:flex;gap:4px;margin-top:2px;min-height:62px}
  .seat .bet{position:absolute;background:rgba(0,0,0,.7);color:var(--gold);padding:3px 8px;border-radius:99px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .seat.dealer .avatar::after{content:"D";position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;background:#fff;color:#000;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--felt-1)}
  .seat .badge{position:absolute;top:-6px;left:-6px;color:#fff;font-size:10px;padding:2px 6px;border-radius:99px;font-weight:600}
  .seat .badge.bb{background:#7c4dff}
  .seat .badge.sb{background:#4dafff}
  .seat .status{font-size:11px;color:var(--text-dim);min-height:14px}
  .seat .status.fold{color:var(--text-mute);text-decoration:line-through}
  .seat .status.allin{color:var(--red);font-weight:700}
  .seat.winner .avatar{transform:scale(1.5);box-shadow:0 0 0 5px var(--gold),0 0 50px var(--gold);animation:winnerPulse .8s ease infinite alternate}
  .seat.winner .name-plate{background:linear-gradient(135deg,var(--gold),#fcc847);border-color:#fcc847}
  .seat.winner .name,.seat.winner .chips{color:#000;font-weight:800}
  @keyframes winnerPulse{ to{ box-shadow:0 0 0 7px #fcc847,0 0 70px var(--gold) } }

  /* 座位位置 */
  .seat[data-pos="0"]{bottom:-9%;left:50%;transform:translateX(-50%)}
  .seat[data-pos="1"]{bottom:14%;left:-4%}
  .seat[data-pos="2"]{top:4%;left:10%}
  .seat[data-pos="3"]{top:-9%;left:50%;transform:translateX(-50%)}
  .seat[data-pos="4"]{top:4%;right:10%}
  .seat[data-pos="5"]{bottom:14%;right:-4%}
  .seat[data-pos="0"] .avatar{order:1}
  .seat[data-pos="0"] .name-plate{order:2}
  .seat[data-pos="0"] .status{order:3}
  .seat[data-pos="0"] .hole{order:4}
  .seat[data-pos="3"] .avatar{order:1}
  .seat[data-pos="3"] .name-plate{order:2}
  .seat[data-pos="3"] .hole{order:0}

  /* Action panel */
  .actions{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:10}
  .turn-timer{display:flex;align-items:center;gap:8px;background:rgba(20,26,32,.94);border:1px solid var(--felt-edge);padding:5px 12px;border-radius:99px;backdrop-filter:blur(6px);width:280px}
  .turn-timer.hidden{display:none}
  .turn-timer .lbl{font-size:10px;color:var(--text-mute);letter-spacing:2px;flex-shrink:0}
  .turn-timer .bar{flex:1;height:6px;background:var(--felt-edge);border-radius:99px;overflow:hidden}
  .turn-timer .bar .fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .1s linear}
  .turn-timer .bar .fill.warn{background:linear-gradient(90deg,var(--gold),var(--red))}
  .turn-timer .bar .fill.danger{background:var(--red)}
  .turn-timer .sec{font-size:13px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
  .action-row{display:flex;gap:14px;align-items:stretch;background:rgba(20,26,32,.94);padding:12px 14px;border-radius:14px;border:1px solid var(--felt-edge);backdrop-filter:blur(6px);box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .btns{display:flex;gap:10px;align-items:stretch}
  .btns button{padding:10px 22px;border-radius:8px;font-size:14px;font-weight:800;border:1px solid var(--felt-edge);background:var(--panel-2);min-width:96px;letter-spacing:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15;color:#3a4750;transition:all .15s}
  .btns button .lbl-txt{color:inherit}
  .btns button .amt{font-size:18px;font-weight:900;letter-spacing:0;font-variant-numeric:tabular-nums}
  .btns button:not(:disabled){color:#fff;border-color:rgba(255,255,255,.22);background:linear-gradient(180deg,#22303d 0%,#192129 100%)}
  .btns button.danger:not(:disabled){color:#ff7878;border-color:rgba(226,59,59,.5)}
  .btns button.primary:not(:disabled){background:linear-gradient(180deg,#fcc847,var(--gold));color:#000;border-color:#fcc847}
  .btns button:not(:disabled):not(.primary):not(.danger):hover{border-color:var(--gold);color:var(--gold)}
  .btns button.primary:not(:disabled):hover{background:linear-gradient(180deg,#ffd968,#fcc847)}
  .btns button.danger:not(:disabled):hover{background:#682b2b;color:#fff}
  .btns button:disabled{opacity:.18;filter:grayscale(.8)}

  /* 加注 floating */
  .raise-float{position:fixed;right:24px;top:50%;transform:translateY(-50%);width:144px;background:rgba(20,26,32,.96);border:1px solid var(--felt-edge);border-radius:12px;padding:0 12px 10px;z-index:11;box-shadow:0 8px 28px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;gap:8px}
  .raise-handle{cursor:move;text-align:center;font-size:11px;color:var(--gold);letter-spacing:4px;font-weight:700;padding:8px 0 6px;width:100%;border-bottom:1px solid var(--felt-edge)}
  .raise-val{font-size:22px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:6px;min-width:108px;text-align:center;border:1px solid var(--gold-2)}
  .vrange-wrap{position:relative;width:48px;height:140px}
  .vrange-track{position:absolute;left:50%;top:0;bottom:0;width:14px;transform:translateX(-50%);background:linear-gradient(to top,#222,var(--felt-edge));border-radius:8px;border:1px solid #2a3038;overflow:hidden}
  .vrange-fill{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(to top,var(--gold-2),var(--gold));transition:height .08s linear}
  .vrange-thumb{position:absolute;left:50%;width:42px;height:18px;transform:translate(-50%,50%);background:linear-gradient(180deg,#fff,#aaa);border:1px solid #555;border-radius:4px;bottom:0}
  .raise-float input[type=range]{
    -webkit-appearance:slider-vertical;appearance:slider-vertical;writing-mode:bt-lr;
    width:48px;height:140px;margin:0;padding:0;opacity:0;cursor:pointer;position:absolute;inset:0;z-index:2;
  }
  .raise-float .quick{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:100%}
  .raise-float .quick button{padding:5px 0;font-size:10px;border:1px solid var(--felt-edge);background:var(--panel-2);color:var(--text-dim);border-radius:4px}
  .raise-float .quick button:hover{border-color:var(--gold);color:var(--gold)}

  /* Sidebar 籌碼排行 */
  .sidebar{width:300px;background:var(--panel);border-left:1px solid var(--felt-edge);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
  .sidebar h4{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);padding:14px 16px 8px;border-bottom:1px solid var(--felt-edge)}
  .panel-block{padding:12px 16px;border-bottom:1px solid var(--felt-edge)}
  .stack-ranking{display:flex;flex-direction:column;gap:5px}
  .rank-row{display:grid;grid-template-columns:22px 1fr 56px;gap:8px;align-items:center;padding:7px 8px;background:rgba(255,255,255,.03);border-radius:6px;transition:transform .55s cubic-bezier(.5,.05,.3,1)}
  .rank-row.eliminated{opacity:.35;filter:grayscale(.7)}
  .rank-row.you{background:rgba(231,181,59,.18);border-left:4px solid var(--gold);padding:9px 10px;animation:youBreathe 1.6s ease infinite alternate}
  .rank-row.you .rr-name,.rank-row.you .rr-bb{color:var(--gold);font-weight:900}
  .rank-row.you .rr-bb{font-size:18px}
  @keyframes youBreathe{ to{ background:rgba(231,181,59,.36); box-shadow:0 0 18px rgba(231,181,59,.5) inset } }
  .rr-num{font-size:13px;color:var(--text-mute);font-weight:800;text-align:center}
  .rank-row:nth-child(1) .rr-num{color:var(--gold)}
  .rr-mid{display:flex;flex-direction:column;gap:3px;min-width:0}
  .rr-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rr-bar{height:8px;background:rgba(0,0,0,.4);border-radius:99px;overflow:hidden}
  .rr-fill{height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold));transition:width .55s cubic-bezier(.5,.05,.3,1);border-radius:99px}
  .rr-bb{font-size:14px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;text-align:right}

  /* End screen */
  #end{align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a2530 0%,#0a0d10 80%)}
  .end-card{background:var(--panel);border:1px solid var(--felt-edge);border-radius:12px;padding:36px 48px;width:min(560px,100%);text-align:center}
  .end-card h2{font-size:28px;font-weight:700;margin-bottom:20px}
  .ranking-table{width:100%;margin:18px 0;border-collapse:collapse;font-size:14px}
  .ranking-table th,.ranking-table td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--felt-edge)}
  .ranking-table th{color:var(--text-mute);font-weight:500;font-size:11px;letter-spacing:1px;text-transform:uppercase}
  .ranking-table tr.you{background:rgba(231,181,59,.08)}
  .ranking-table tr.you td{color:var(--gold);font-weight:600}
  .end-card button{padding:12px 24px;border-radius:6px;font-weight:600;background:var(--gold);color:#000;letter-spacing:2px;margin-top:14px}

  /* Toast */
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid var(--gold);color:var(--gold);padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
  .toast.show{opacity:1}

  /* 升盲 / 比牌 大字 */
  .big-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;pointer-events:none;background:rgba(0,0,0,.4)}
  .big-card{padding:28px 56px;background:linear-gradient(135deg,#1a2530,#0a0d10);border:3px solid var(--gold);border-radius:16px;text-align:center;box-shadow:0 0 80px var(--gold)}
  .big-stage{font-size:14px;color:var(--text-mute);letter-spacing:6px;margin-bottom:6px}
  .big-title{font-size:48px;font-weight:900;color:var(--gold);letter-spacing:10px;margin-bottom:8px;text-shadow:0 0 40px var(--gold)}
  .big-desc{font-size:18px;color:#fcc847;letter-spacing:4px;font-weight:800}
  .big-overlay.fade-out{animation:bigFade .3s ease forwards}
  @keyframes bigFade{ to{ opacity:0 } }

  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--felt-edge);border-radius:4px}

  /* ============ 視覺特效 ============ */
  /* 效果 toast (角色觸發) */
  .effect-toast-stack{position:fixed;top:88px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:max-content;max-width:92%}
  .effect-toast{background:linear-gradient(135deg,var(--gold) 0%,#fcc847 100%);color:#000;padding:13px 26px;border-radius:12px;font-weight:900;font-size:18px;letter-spacing:2px;box-shadow:0 10px 32px rgba(231,181,59,.5),0 6px 16px rgba(0,0,0,.6);white-space:nowrap;display:flex;align-items:center;gap:14px;animation:eToastIn .35s ease, eToastOut .4s ease 3.6s forwards}
  .effect-toast .et-name{display:inline-block;background:rgba(0,0,0,.3);padding:5px 14px;border-radius:6px;font-size:14px;letter-spacing:4px;font-weight:800}
  .effect-toast .et-amt{color:#7c1e1e;font-size:22px;font-weight:900;margin-left:4px}
  .effect-toast.red{background:linear-gradient(135deg,#c93030,#e23b3b);color:#fff}
  .effect-toast.red .et-name{background:rgba(255,255,255,.2)}
  .effect-toast.red .et-amt{color:#fff}
  .effect-toast.purple{background:linear-gradient(135deg,#7c4dff,#a987ff);color:#fff}
  .effect-toast.purple .et-name{background:rgba(255,255,255,.18)}
  .effect-toast.purple .et-amt{color:#fff;text-shadow:0 0 12px #fff}
  @keyframes eToastIn{from{opacity:0;transform:translateY(-20px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes eToastOut{to{opacity:0;transform:translateY(-20px) scale(.95)}}

  /* 升盲大彈窗 */
  .blind-up-overlay{position:fixed;top:50%;left:50%;z-index:180;pointer-events:none;animation:buPop 2.9s ease forwards}
  .blind-up-card{background:linear-gradient(135deg,#1a2530,#0a0d10);border:3px solid var(--gold);border-radius:18px;padding:32px 72px;text-align:center;box-shadow:0 0 100px rgba(231,181,59,.6),inset 0 0 40px rgba(231,181,59,.06)}
  .bu-stage{font-size:13px;letter-spacing:8px;color:var(--text-mute);margin-bottom:4px;font-weight:700}
  .bu-level{font-size:54px;font-weight:900;color:var(--gold);letter-spacing:10px;margin-bottom:6px;text-shadow:0 0 40px var(--gold),0 4px 12px rgba(0,0,0,.8)}
  .bu-ratio{font-size:18px;color:#fcc847;letter-spacing:6px;margin-bottom:20px;font-weight:800}
  .bu-ratio .arrow{color:var(--green);margin-right:8px;text-shadow:0 0 12px var(--green)}
  .bu-blinds{font-size:42px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:4px;margin-bottom:14px;text-shadow:0 4px 12px rgba(0,0,0,.8)}
  .bu-stack{font-size:15px;color:var(--gold);letter-spacing:3px;padding:8px 22px;background:rgba(0,0,0,.5);border-radius:8px;display:inline-block;border:1px solid var(--felt-edge);font-weight:700}
  .bu-stack strong{font-size:24px;font-weight:900;margin:0 4px;font-variant-numeric:tabular-nums}
  @keyframes buPop{
    0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:0}
    8%{transform:translate(-50%,-50%) scale(1.18) rotate(2deg);opacity:1}
    16%{transform:translate(-50%,-50%) scale(1) rotate(0)}
    85%{transform:translate(-50%,-50%) scale(1);opacity:1}
    100%{transform:translate(-50%,-50%) scale(.92);opacity:0}
  }

  /* 比牌大字牌型名 */
  .showdown-handname{
    position:fixed;top:30%;left:50%;transform:translateX(-50%) scale(0);
    font-size:78px;font-weight:900;color:var(--gold);
    text-shadow:0 0 50px var(--gold),0 0 100px rgba(231,181,59,.7),0 6px 16px rgba(0,0,0,.95);
    letter-spacing:14px;z-index:30;pointer-events:none;
    background:rgba(0,0,0,.6);padding:20px 60px;border-radius:18px;
    border:3px solid var(--gold);box-shadow:0 0 80px rgba(231,181,59,.5);
    animation:sdNamePop 3s ease forwards;white-space:nowrap;
  }
  @keyframes sdNamePop{
    0%{transform:translateX(-50%) scale(0) rotate(-12deg);opacity:0}
    8%{transform:translateX(-50%) scale(1.4) rotate(4deg);opacity:1}
    18%{transform:translateX(-50%) scale(1.05) rotate(0)}
    85%{transform:translateX(-50%) scale(1) translateY(-8px);opacity:1}
    100%{transform:translateX(-50%) scale(.9) translateY(-30px);opacity:0}
  }

  /* 牌型升級 toast */
  .rank-up-toast{position:fixed;top:35%;left:50%;font-weight:900;color:#fcc847;text-shadow:0 0 60px var(--gold),0 4px 16px rgba(0,0,0,.8);z-index:150;pointer-events:none;letter-spacing:10px;font-size:60px;animation:rankUpAnim 2.4s ease forwards}
  .rank-up-toast .arrow{display:block;font-size:40px;margin-bottom:6px;color:var(--green);text-shadow:0 0 30px var(--green)}
  .rank-up-toast .from{display:block;font-size:18px;color:var(--text-dim);letter-spacing:6px;margin-bottom:6px;text-shadow:none;font-weight:600}
  @keyframes rankUpAnim{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-15deg)}
    15%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(0)}
    30%{transform:translate(-50%,-50%) scale(1)}
    75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
    100%{opacity:0;transform:translate(-50%,-90%) scale(.95)}
  }

  /* 飛籌碼到底池 */
  .chip-fly{position:fixed;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--gold) 35%,var(--gold-2) 100%);border:2px dashed rgba(255,255,255,.7);box-shadow:0 4px 12px rgba(0,0,0,.6),inset 0 0 8px rgba(0,0,0,.3);z-index:50;pointer-events:none;transition:all .65s cubic-bezier(.5,.05,.3,1)}

  /* 動作彈出文字（座位上方） */
  .action-pop{position:absolute;top:-32px;left:50%;transform:translateX(-50%) scale(0);font-weight:900;letter-spacing:6px;font-size:18px;z-index:6;pointer-events:none;white-space:nowrap;animation:actionPopAnim 1.6s ease forwards}
  .action-pop.raise{color:var(--gold);text-shadow:0 0 16px var(--gold),0 2px 8px rgba(0,0,0,.8)}
  .action-pop.fold{color:#888;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  .action-pop.call,.action-pop.check{color:var(--green);text-shadow:0 0 12px var(--green),0 2px 8px rgba(0,0,0,.8)}
  .action-pop.allin{color:#fff;font-size:28px;letter-spacing:10px;text-shadow:0 0 24px var(--red),0 0 60px var(--red),0 0 100px var(--gold);animation:actionPopAllin 2.2s ease forwards}
  @keyframes actionPopAnim{
    0%{transform:translateX(-50%) scale(0) rotate(-8deg);opacity:0}
    20%{transform:translateX(-50%) scale(1.2) rotate(0);opacity:1}
    40%{transform:translateX(-50%) scale(1)}
    80%{transform:translateX(-50%) scale(1) translateY(-12px);opacity:1}
    100%{transform:translateX(-50%) scale(.85) translateY(-22px);opacity:0}
  }
  @keyframes actionPopAllin{
    0%{transform:translateX(-50%) scale(0) rotate(-12deg);opacity:0}
    15%{transform:translateX(-50%) scale(1.6) rotate(2deg);opacity:1}
    30%{transform:translateX(-50%) scale(1.1) rotate(0)}
    50%{transform:translateX(-50%) scale(1.25);filter:hue-rotate(15deg)}
    80%{transform:translateX(-50%) scale(1.1) translateY(-8px);opacity:1}
    100%{transform:translateX(-50%) scale(.9) translateY(-24px);opacity:0}
  }

  /* WIN 徽章 */
  .win-badge{position:absolute;top:-22px;left:50%;transform:translateX(-50%);padding:5px 16px;background:linear-gradient(135deg,var(--gold),#fcc847);color:#000;border-radius:6px;font-weight:900;font-size:13px;letter-spacing:5px;z-index:6;box-shadow:0 0 24px var(--gold),0 4px 12px rgba(0,0,0,.5);animation:winBadgePop .4s ease,winBadgeFloat .8s ease .4s infinite alternate}
  @keyframes winBadgePop{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}
  @keyframes winBadgeFloat{to{transform:translateX(-50%) translateY(-4px) scale(1.05)}}

  /* showdown 強化亮 winner 牌 */
  .card.showdown-matched{
    box-shadow:0 0 0 5px var(--gold),0 0 40px var(--gold),0 0 80px rgba(231,181,59,.6)!important;
    z-index:8!important;position:relative;
    animation:showdownFlash .55s ease-in-out infinite alternate!important;
  }
  @keyframes showdownFlash{
    from{box-shadow:0 0 0 5px var(--gold),0 0 40px var(--gold),0 0 80px rgba(231,181,59,.6)!important;transform:translateY(-8px) scale(1.06)}
    to{box-shadow:0 0 0 7px #fcc847,0 0 60px #fff8d6,0 0 120px var(--gold)!important;transform:translateY(-12px) scale(1.12)}
  }

  /* 角色 chip（座位上小標） */
  .seat .talent-chip{
    position:absolute;top:-8px;right:-6px;background:rgba(0,0,0,.85);border:1px solid var(--gold);
    padding:2px 6px;border-radius:99px;font-size:14px;line-height:1;z-index:5;
    box-shadow:0 0 12px rgba(231,181,59,.4);
  }
  .seat .talent-chip.you{background:linear-gradient(135deg,var(--gold),#fcc847);}

  /* 大廳：角色選擇 grid */
  .char-section{margin-top:18px;padding-top:18px;border-top:1px solid var(--felt-edge)}
  .char-section .lbl-h{font-size:12px;color:var(--text-dim);letter-spacing:3px;margin-bottom:8px;text-align:center}
  .char-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:240px;overflow-y:auto;padding:4px}
  .char-card{border:1.5px solid var(--felt-edge);background:var(--panel-2);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
  .char-card:hover{border-color:var(--gold);transform:translateY(-2px)}
  .char-card.selected{border-color:var(--gold);background:linear-gradient(135deg,rgba(231,181,59,.25),rgba(231,181,59,.06));box-shadow:0 0 14px rgba(231,181,59,.4)}
  .char-card.taken{opacity:.32;cursor:not-allowed;border-color:var(--felt-edge)}
  .char-card.taken:hover{transform:none}
  .char-card .ico{font-size:26px;margin-bottom:3px;line-height:1}
  .char-card .nm{font-size:11px;font-weight:700;color:var(--text);letter-spacing:1px}
  .char-card .by{position:absolute;top:2px;right:4px;font-size:8px;color:var(--gold);font-weight:900;letter-spacing:.5px}
  .char-tip{margin-top:8px;padding:8px 12px;background:rgba(0,0,0,.4);border-radius:6px;font-size:12px;color:var(--text-dim);line-height:1.5;min-height:40px}
  .char-tip strong{color:var(--gold);font-size:13px;letter-spacing:2px}

  /* 能力選擇 modal */
  .power-pick-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
  .power-pick-card{background:var(--panel);border:3px solid var(--gold);border-radius:18px;padding:28px 36px;width:min(820px,100%);box-shadow:0 0 100px rgba(231,181,59,.4)}
  .pp-title{font-size:24px;font-weight:900;color:var(--gold);text-align:center;letter-spacing:6px;margin-bottom:6px}
  .pp-sub{font-size:13px;color:var(--text-dim);text-align:center;letter-spacing:2px;margin-bottom:18px}
  .pp-cd{color:var(--gold);font-weight:900;font-size:18px}
  .power-pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .power-card{border:2px solid var(--felt-edge);border-radius:14px;padding:18px 14px;text-align:center;cursor:pointer;background:linear-gradient(135deg,rgba(231,181,59,.04),rgba(0,0,0,.4));transition:all .2s}
  .power-card:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 0 30px rgba(231,181,59,.4),0 8px 16px rgba(0,0,0,.5)}
  .pc-ico{font-size:46px;margin-bottom:8px;line-height:1}
  .pc-name{font-size:18px;font-weight:900;color:var(--gold);letter-spacing:3px;margin-bottom:8px}
  .pc-desc{font-size:13px;color:var(--text-dim);line-height:1.5}

  /* 別人在選能力時的 banner */
  .pick-pending-banner{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(124,77,255,.95);color:#fff;padding:12px 26px;border-radius:99px;font-size:15px;font-weight:700;letter-spacing:2px;z-index:140;box-shadow:0 8px 28px rgba(124,77,255,.5);display:flex;align-items:center;gap:12px}
  .pick-pending-banner .cd{font-weight:900;font-size:17px;color:#fcc847;font-variant-numeric:tabular-nums}

  /* 能力 chip 在座位旁 */
  .seat .powers-row{position:absolute;display:flex;gap:2px;flex-wrap:wrap;max-width:140px;justify-content:center}
  .seat[data-pos="0"] .powers-row,.seat[data-pos="1"] .powers-row,.seat[data-pos="5"] .powers-row{top:-4px;left:50%;transform:translateX(-50%)}
  .seat[data-pos="2"] .powers-row,.seat[data-pos="3"] .powers-row,.seat[data-pos="4"] .powers-row{bottom:-12px;left:50%;transform:translateX(-50%)}
  .seat .pwr-chip{background:rgba(124,77,255,.35);border:1px solid #a987ff;font-size:12px;line-height:1;padding:2px 4px;border-radius:99px;box-shadow:0 0 8px rgba(124,77,255,.4);z-index:5}

  /* 大型能力描述彈窗 */
  .power-desc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:170;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:eBigBgIn .3s ease}
  .power-desc-card{padding:32px 56px;background:linear-gradient(135deg,#1a2530,#0a0d10);border:3px solid var(--gold);border-radius:18px;text-align:center;max-width:560px;animation:eBigPop .4s ease}
  .pdc-ico{font-size:64px;margin-bottom:8px;line-height:1}
  .pdc-name{font-size:30px;font-weight:900;color:var(--gold);letter-spacing:6px;margin-bottom:14px;text-shadow:0 0 30px var(--gold)}
  .pdc-target{font-size:17px;color:#fcc847;font-weight:700;margin-bottom:14px}
  .pdc-target strong{color:#fff;font-size:20px;margin:0 6px}
  .pdc-desc{font-size:15px;color:var(--text-dim);line-height:1.7;margin-bottom:14px}
  .pdc-amt{font-size:32px;font-weight:900;color:var(--gold);letter-spacing:4px}
  .pdc-tap{font-size:11px;color:var(--text-mute);letter-spacing:2px;margin-top:14px}
  @keyframes eBigBgIn{from{opacity:0}to{opacity:1}}
  @keyframes eBigPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

  /* mode banner（遊戲畫面頂部） */
  .mode-banner{background:linear-gradient(90deg,rgba(231,181,59,.04),rgba(231,181,59,.18) 50%,rgba(231,181,59,.04));border-bottom:1px solid var(--felt-edge);padding:8px 18px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:13px;flex-shrink:0;color:var(--text)}
  .mode-banner .ico{font-size:18px}
  .mode-banner .nm{font-weight:800;color:var(--gold);letter-spacing:3px;font-size:15px}
  .mode-banner .lv{padding:2px 8px;background:var(--gold);color:#000;font-size:11px;font-weight:800;border-radius:4px;letter-spacing:2px}
  .mode-banner .ds{color:var(--text-dim);font-size:12px}

  /* 大廳 mode 選擇 */
  .mode-section{margin-top:18px;padding-top:18px;border-top:1px solid var(--felt-edge)}
  .mode-section .lbl-h{font-size:12px;color:var(--text-dim);letter-spacing:3px;margin-bottom:8px;text-align:center}
  .mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
  .mode-card{border:1.5px solid var(--felt-edge);background:var(--panel-2);border-radius:6px;padding:8px 4px;text-align:center;cursor:pointer;transition:all .15s}
  .mode-card:hover{border-color:var(--gold)}
  .mode-card.selected{border-color:var(--gold);background:linear-gradient(135deg,rgba(231,181,59,.25),rgba(231,181,59,.06))}
  .mode-card .nm{font-size:11px;font-weight:700;letter-spacing:1px}
  .level-row{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
  .level-row button{padding:5px 14px;background:var(--panel-2);border:1px solid var(--felt-edge);color:var(--text-dim);border-radius:6px;font-size:12px;letter-spacing:2px}
  .level-row button.active{background:var(--gold);color:#000;border-color:var(--gold)}
  .mode-detail-tip{padding:8px 12px;background:rgba(0,0,0,.4);border-radius:6px;font-size:12px;color:var(--text-dim);line-height:1.5;min-height:36px}

  /* 我的牌型呼吸燈（側欄） */
  .my-hand-block{padding:14px 16px;border-bottom:1px solid var(--felt-edge);background:linear-gradient(180deg,rgba(231,181,59,.08),transparent)}
  .my-hand-block .lbl{font-size:10px;color:var(--text-mute);letter-spacing:2px;margin-bottom:4px}
  .my-hand-block .val{font-size:22px;font-weight:900;color:var(--gold);letter-spacing:3px;animation:myHandBreathe 1.6s ease infinite alternate}
  @keyframes myHandBreathe{to{text-shadow:0 0 20px var(--gold)}}
  .my-hand-block.up .val{animation:myHandUp 1.6s ease}
  @keyframes myHandUp{
    0%{transform:scale(1)} 15%{transform:scale(1.5);color:#fcc847}
    35%{transform:scale(1.2) rotate(-2deg)} 55%{transform:scale(1.3) rotate(2deg)}
    100%{transform:scale(1)}
  }
</style>
</head>
<body>

<div class="conn-state" id="connState">連線中…</div>

<!-- ============ LOBBY ============ -->
<div id="lobby" class="screen">
  <div class="lobby-title">德撲<span class="gold">錦標賽</span></div>
  <div class="lobby-sub">多人連線版 · 經典模式</div>
  <div class="lobby-card">
    <div class="toggle-form">
      <button id="modeCreate" class="active">建立房間</button>
      <button id="modeJoin">加入房間</button>
    </div>

    <div class="form-row">
      <label>你的名字</label>
      <input type="text" id="playerName" placeholder="輸入暱稱（最多 12 字）" maxlength="12">
    </div>

    <!-- 建房：設定房間 -->
    <div id="createForm">
      <div class="room-settings">
        <div class="form-row">
          <label>AI 對手數</label>
          <input type="number" id="aiCount" min="0" max="5" value="3">
        </div>
        <div class="form-row">
          <label>思考時間 (秒)</label>
          <input type="number" id="baseTurnSec" min="5" max="60" value="20">
        </div>
        <div class="form-row">
          <label>升盲時間 (秒)</label>
          <input type="number" id="blindSec" min="30" max="300" value="120">
        </div>
      </div>
    </div>

    <!-- 加房：輸入邀請碼 -->
    <div id="joinForm" class="hidden">
      <div class="form-row">
        <label>邀請碼</label>
        <input type="text" id="roomCode" placeholder="輸入 5 字邀請碼" maxlength="5" style="text-transform:uppercase;letter-spacing:6px;font-family:Menlo,monospace">
      </div>
    </div>

    <div class="lobby-actions">
      <button class="primary" id="btnGo">開始</button>
    </div>
  </div>
</div>

<!-- ============ WAITING ROOM ============ -->
<div id="wait" class="screen hidden">
  <div class="wait-card">
    <div style="font-size:14px;color:var(--text-mute);letter-spacing:3px">邀請碼</div>
    <div class="wait-code" id="waitCode">—</div>
    <button class="copy-btn" id="copyCodeBtn">複製邀請連結</button>
    <div class="wait-hint">告訴朋友這 5 個字，他們點「加入房間」輸入就能進來</div>
    <div class="wait-players" id="waitPlayers"></div>

    <div class="mode-section" id="modeSection">
      <div class="lbl-h">— 變體玩法（房主決定）—</div>
      <div class="mode-grid" id="modeGrid"></div>
      <div class="level-row" id="levelRow"></div>
      <div class="mode-detail-tip" id="modeDetailTip">經典模式</div>
    </div>

    <div class="char-section">
      <div class="lbl-h">— 選你的角色天賦（不選會隨機分配）—</div>
      <div class="char-grid" id="charGrid"></div>
      <div class="char-tip" id="charTip">點一個角色看效果說明</div>
    </div>

    <div class="wait-actions">
      <button class="leave" id="leaveBtn">離開</button>
      <button class="start hidden" id="startBtn">開始遊戲</button>
    </div>
    <div style="font-size:11px;color:var(--text-mute);margin-top:14px;letter-spacing:1px" id="waitNote">只有房主能開始遊戲</div>
  </div>
</div>

<!-- ============ GAME SCREEN ============ -->
<div id="game" class="screen hidden">
  <div class="main">
    <div class="mode-banner hidden" id="modeBanner">
      <span class="ico">🎲</span>
      <span class="nm" id="modeName">經典傳奇</span>
      <span class="lv" id="modeLv">LV 1</span>
      <span class="ds" id="modeDesc">標準德州撲克</span>
    </div>
    <div class="topbar">
      <div class="info-block">
        <div class="lbl">手牌</div>
        <div class="val" id="handNum">#0</div>
      </div>
      <div class="info-block">
        <div class="lbl">盲注</div>
        <div class="val gold" id="blindsTxt">—</div>
      </div>
      <div class="info-block">
        <div class="lbl">下次升盲</div>
        <div class="val timer" id="blindTimer">—</div>
      </div>
      <div class="info-block">
        <div class="lbl">底池</div>
        <div class="val gold" id="topPot">—</div>
      </div>
      <div class="right">
        <button class="icon" id="quitBtn">離開</button>
      </div>
    </div>

    <div class="table-wrap">
      <div class="felt" id="felt">
        <div class="center">
          <div class="pot">
            <div class="lbl">POT</div>
            <div class="val" id="potVal">0</div>
          </div>
          <div class="community" id="community"></div>

// 簡化版 5 張牌評分（給 client 算自己當前牌型）
function _score5(five){
  const vals = five.map(c=>RANK_VAL[c.rank]).sort((a,b)=>b-a);
  const suits = five.map(c=>c.suit);
  const rcnt = {};
  for(const v of vals) rcnt[v] = (rcnt[v]||0)+1;
  const groups = Object.entries(rcnt).map(([v,c])=>({v:+v,c})).sort((a,b)=>b.c-a.c||b.v-a.v);
  const flush = suits.every(s=>s===suits[0]);
  let str = false;
  for(let i=0;i<4;i++) if(vals[i]-vals[i+1]!==1){ str=false; break; } else if(i===3) str=true;
  if(!str){ str = (vals[0]===14 && vals[1]===5 && vals[2]===4 && vals[3]===3 && vals[4]===2); }
  if(str&&flush) return [vals[0]===14?9:8, vals[0]];
  if(groups[0].c===4) return [7, groups[0].v];
  if(groups[0].c===3 && groups[1] && groups[1].c===2) return [6, groups[0].v];
  if(flush) return [5, ...vals];
  if(str) return [4, vals[0]];
  if(groups[0].c===3) return [3, groups[0].v];
  if(groups[0].c===2 && groups[1] && groups[1].c===2) return [2, Math.max(groups[0].v,groups[1].v)];
  if(groups[0].c===2) return [1, groups[0].v];
  return [0, ...vals];
}
function _bestType(cards){
  if(!cards || cards.length<5) return -1;
  const idx=[];
  for(let a=0;a<cards.length-4;a++) for(let b=a+1;b<cards.length-3;b++)
    for(let c=b+1;c<cards.length-2;c++) for(let d=c+1;d<cards.length-1;d++)
      for(let e=d+1;e<cards.length;e++) idx.push([a,b,c,d,e]);
  let best=-1;
  for(const cb of idx){
    const sc = _score5(cb.map(i=>cards[i]));
    if(sc[0] > best) best = sc[0];
  }
  return best;
}

function flyChipsToPot(seatEl, amount){
  if(!seatEl) return;
  const potEl = $('#potVal');
  if(!potEl) return;
  const seatRect = seatEl.getBoundingClientRect();
  const potRect = potEl.getBoundingClientRect();
  const startX = seatRect.left + seatRect.width/2;
  const startY = seatRect.top + seatRect.height/2;
  const endX = potRect.left + potRect.width/2;
  const endY = potRect.top + potRect.height/2;
  const count = Math.min(6, Math.max(2, Math.floor(Math.log10(Math.max(amount,10)))+1));
  for(let i=0;i<count;i++){
    const chip = document.createElement('div');
    chip.className = 'chip-fly';
    chip.style.left = (startX - 16 + (Math.random()-0.5)*16) + 'px';
    chip.style.top = (startY - 16 + (Math.random()-0.5)*8) + 'px';
    chip.style.opacity = '0';
    chip.style.transform = 'scale(0.3)';
    document.body.appendChild(chip);
    setTimeout(()=>{
      chip.style.opacity = '1';
      chip.style.transform = 'scale(1)';
    }, i*60);
    setTimeout(()=>{
      chip.style.left = (endX - 16 + (Math.random()-0.5)*30) + 'px';
      chip.style.top = (endY - 16 + (Math.random()-0.5)*16) + 'px';
      chip.style.opacity = '0.3';
      chip.style.transform = 'scale(0.6)';
    }, i*60 + 200);
    setTimeout(()=> chip.remove(), i*60 + 900);
  }
}

// 把 server 的 player 列表（不固定 6 人）映射到 6 個座位
// 玩家自己永遠在 pos 0，其他人按順序排
function mapToSeats(state){
  const players = state.players;
  const myIdx = players.findIndex(p=> p.id === myId);
  const order = [];
  if(myIdx >= 0){
    for(let i=0;i<players.length;i++){
      order.push(players[(myIdx + i) % players.length]);
    }
  } else {
    // 觀戰：照原順序
    for(let i=0;i<players.length;i++) order.push(players[i]);
  }
  const seatMap = new Array(6).fill(null);
  for(let i=0;i<order.length && i<6;i++){
    seatMap[i] = order[i];
  }
  return seatMap;
}

function renderTable(state){
  if(!state) return;
  $('#handNum').textContent = '#' + state.handNum;
  $('#blindsTxt').textContent = `${fmt(state.sb)} / ${fmt(state.bb)}`;
  $('#topPot').textContent = fmt(state.pot);
  $('#potVal').textContent = fmt(state.pot);

  // Community
  const comm = $('#community');
  comm.innerHTML = '';
  for(let i=0;i<5;i++){
    if(state.community[i]){
      comm.appendChild(cardEl(state.community[i]));
    } else {
      const ph = document.createElement('div');
      ph.className = 'card placeholder';
      comm.appendChild(ph);
    }
  }

  // Seats
  const seats = $$('.seat');
  const map = mapToSeats(state);
  for(let i=0;i<6;i++){
    const seat = seats[i];
    const p = map[i];
    if(!p){
      seat.style.display = 'none';
      continue;
    }
    seat.style.display = '';
    seat.classList.toggle('eliminated', !p.alive);
    seat.classList.toggle('folded', p.alive && p.folded);
    seat.classList.toggle('active', state.currentPlayerId === p.id && state.street !== 'showdown');
    seat.classList.toggle('dealer', state.dealerPos === state.players.indexOf(p));
    seat.classList.toggle('you', p.id === myId);
    seat.querySelector('.name').textContent = p.name + (p.isAI?' 🤖':'');
    seat.querySelector('.chips').textContent = fmt(p.chips);

    const hole = seat.querySelector('.hole');
    hole.innerHTML = '';
    if(p.hasHole){
      // 自己看得到面、別人看不到（除非 server 在 showdown 時送 reveal）
      const cards = p.hole;
      for(let j=0;j<2;j++){
        if(cards && cards[j]){
          hole.appendChild(cardEl(cards[j], true));
        } else {
          const back = document.createElement('div');
          back.className = 'card back small';
          hole.appendChild(back);
        }
      }
    }

    const betEl = seat.querySelector('.bet');
    if(p.bet > 0){ betEl.textContent = fmt(p.bet); betEl.style.display=''; }
    else { betEl.style.display = 'none'; }

    const status = seat.querySelector('.status');
    if(!p.alive){ status.textContent='已淘汰'; status.className='status'; }
    else if(p.folded){ status.textContent='棄牌'; status.className='status fold'; }
    else if(p.allIn){ status.textContent='ALL IN'; status.className='status allin'; }
    else { status.textContent=''; status.className='status'; }

    // SB / BB badge
    seat.querySelectorAll('.badge').forEach(b=> b.remove());
    const playerIdxInState = state.players.findIndex(x=> x.id === p.id);
    if(playerIdxInState === state.sbPos){
      const b = document.createElement('div'); b.className='badge sb'; b.textContent='SB'; seat.appendChild(b);
    }
    if(playerIdxInState === state.bbPos){
      const b = document.createElement('div'); b.className='badge bb'; b.textContent='BB'; seat.appendChild(b);
    }
    // 角色 chip
    seat.querySelectorAll('.talent-chip').forEach(b=> b.remove());
    if(p.talent){
      const c = CHAR_BY_ID[p.talent];
      if(c){
        const chip = document.createElement('div');
        chip.className = 'talent-chip' + (p.id===myId?' you':'');
        chip.textContent = c.icon;
        chip.title = `${c.name} — ${c.desc}`;
        seat.appendChild(chip);
      }
    }
    // 能力 chips
    seat.querySelectorAll('.powers-row').forEach(b=> b.remove());
    if(p.powerUps && p.powerUps.length){
      const row = document.createElement('div');
      row.className = 'powers-row';
      p.powerUps.forEach(pid=>{
        const pw = POWER_BY_ID[pid];
        if(!pw) return;
        const c = document.createElement('span');
        c.className = 'pwr-chip';
        c.textContent = pw.icon;
        c.title = `${pw.name} — ${pw.desc}`;
        row.appendChild(c);
      });
      seat.appendChild(row);
    }
    // 記下 seat 方便 action-pop / flyChip 找 DOM
    playerSeatMap.set(p.id, seat);
  }

  // 我的當前牌型（公牌 ≥ 3 才算）
  updateMyHand(state);

  renderStackRanking(state);
}

function updateMyHand(state){
  const block = $('#myHandBlock');
  if(!block) return;
  const me = state.players.find(p=> p.id === myId);
  if(!me || !me.hole || me.hole.length < 2 || (state.community||[]).length < 3 || me.folded || !me.alive){
    block.style.display = 'none';
    lastMyHandType = -1;
    return;
  }
  const all = me.hole.concat(state.community);
  const t = _bestType(all);
  if(t < 0){ block.style.display = 'none'; return; }
  block.style.display = '';
  $('#myHandVal').textContent = HAND_TYPES[t] || '?';
  if(lastMyHandType >= 0 && t > lastMyHandType){
    block.classList.remove('up');
    void block.offsetWidth;
    block.classList.add('up');
    showRankUpToast(HAND_TYPES[lastMyHandType], HAND_TYPES[t]);
    setTimeout(()=> block.classList.remove('up'), 1700);
  }
  lastMyHandType = t;
}

function cardEl(c, small){
  const el = document.createElement('div');
  el.className = `card ${c.suit}` + (small?' small':'');
  el.innerHTML = `<div class="r">${c.rank==='T'?'10':c.rank}</div><div class="s">${SUIT_SYM[c.suit]||c.suit}</div>`;
  return el;
}

function renderStackRanking(state){
  const c = $('#stackRanking');
  if(!c) return;
  const all = state.players.slice();
  const ranked = all.sort((a,b)=>{
    if(a.alive !== b.alive) return a.alive ? -1 : 1;
    return b.chips - a.chips;
  });
  const maxChips = Math.max(1, ...ranked.filter(p=>p.alive).map(p=>p.chips));
  const oldTops = {};
  Array.from(c.children).forEach(child=>{
    if(child.dataset.id !== undefined) oldTops[child.dataset.id] = child.getBoundingClientRect().top;
  });
  c.innerHTML = '';
  ranked.forEach((p, i)=>{
    const row = document.createElement('div');
    row.className = 'rank-row';
    row.dataset.id = p.id;
    if(p.id === myId) row.classList.add('you');
    if(!p.alive) row.classList.add('eliminated');
    const bb = state.bb > 0 ? Math.floor(p.chips / state.bb) : 0;
    const w = p.alive ? Math.min(100, (p.chips / maxChips) * 100) : 0;
    row.innerHTML = `
      <div class="rr-num">${i+1}</div>
      <div class="rr-mid">
        <div class="rr-name">${p.name}</div>
        <div class="rr-bar"><div class="rr-fill" style="width:${w}%"></div></div>
      </div>
      <div class="rr-bb">${bb}<span style="font-size:9px;margin-left:1px">BB</span></div>
    `;
    c.appendChild(row);
  });
  Array.from(c.children).forEach(child=>{
    const id = child.dataset.id;
    if(oldTops[id] === undefined) return;
    const newTop = child.getBoundingClientRect().top;
    const delta = oldTops[id] - newTop;
    if(Math.abs(delta) > 1){
      child.style.transition = 'none';
      child.style.transform = `translateY(${delta}px)`;
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ child.style.transition=''; child.style.transform=''; }); });
    }
  });
}

// ============ Action UI ============
let myTurnDeadline = 0;
let myValidActions = [];
let myNeed = 0;
let myMinRaise = 0;
let myMaxRaise = 0;

function setMyTurn(t){
  myTurnDeadline = t.deadline || 0;
  myValidActions = t.validActions || [];
  myNeed = t.need || 0;
  myMinRaise = t.minRaiseTo || 0;
  myMaxRaise = t.maxRaiseTo || 0;

  $('#btnFold').disabled = !myValidActions.includes('fold');
  $('#btnCheck').disabled = !myValidActions.includes('check');
  $('#btnCall').disabled = !myValidActions.includes('call');
  $('#btnRaise').disabled = !myValidActions.includes('raise');
  $('#btnAllIn').disabled = !myValidActions.includes('allin');

  $('#btnCall').innerHTML = myNeed>0
    ? `<span class="lbl-txt">跟注</span><span class="amt">${fmt(myNeed)}</span>`
    : `<span class="lbl-txt">過牌</span>`;

  // 設定 raise range
  const range = $('#raiseRange');
  range.min = myMinRaise;
  range.max = Math.max(myMinRaise + 1, myMaxRaise);
  range.value = Math.min(myMaxRaise, Math.max(myMinRaise, myMinRaise + (myMaxRaise - myMinRaise) * 0.3));
  updateRaiseVisual();
}
function clearMyTurn(){
  myValidActions = [];
  $$('.btns button').forEach(b=> b.disabled = true);
  $('#turnFill').style.width = '100%';
  $('#turnSec').textContent = '—';
}

function updateRaiseVisual(){
  const range = $('#raiseRange');
  const v = +range.value;
  const min = +range.min, max = +range.max;
  const pct = max>min ? (v-min)/(max-min)*100 : 0;
  $('#raiseVal').textContent = fmt(v);
  $('#vrangeFill').style.height = pct + '%';
  $('#vrangeThumb').style.bottom = pct + '%';
  if($('#btnRaise')){
    $('#btnRaise').innerHTML = `<span class="lbl-txt">${myValidActions.includes('raise')?'加注':'下注'}</span><span class="amt">${fmt(v)}</span>`;
  }
}

$('#raiseRange').addEventListener('input', updateRaiseVisual);
$$('.raise-float .quick button').forEach(b=>{
  b.addEventListener('click', ()=>{
    if(!lastState) return;
    const range = $('#raiseRange');
    const q = b.dataset.quick;
    let v;
    if(q === 'min') v = +range.min;
    else if(q === 'max') v = +range.max;
    else {
      const myP = lastState.players.find(p=> p.id === myId);
      const pot = lastState.pot;
      v = Math.floor((myP?.bet || 0) + pot * (+q));
    }
    v = Math.min(+range.max, Math.max(+range.min, v));
    range.value = v;
    updateRaiseVisual();
  });
});

// 加注 floating 拖曳
function makeRaiseDraggable(){
  const el = $('#raiseFloat');
  const handle = el?.querySelector('.raise-handle');
  if(!el || !handle) return;
  let dragging = false, sx, sy, sl, st;
  const onDown = e => {
    dragging = true;
    const ev = e.touches ? e.touches[0] : e;
    sx = ev.clientX; sy = ev.clientY;
    const rect = el.getBoundingClientRect();
    sl = rect.left; st = rect.top;
    el.style.left = sl+'px'; el.style.top = st+'px';
    el.style.right = 'auto'; el.style.bottom = 'auto';
    el.style.transform = 'none';
    document.body.style.cursor = 'grabbing';
    e.preventDefault();
  };
  const onMove = e => {
    if(!dragging) return;
    const ev = e.touches ? e.touches[0] : e;
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    let nl = sl + dx, nt = st + dy;
    nl = Math.max(0, Math.min(window.innerWidth - el.offsetWidth, nl));
    nt = Math.max(0, Math.min(window.innerHeight - el.offsetHeight, nt));
    el.style.left = nl+'px'; el.style.top = nt+'px';
  };
  const onUp = () => {
    if(!dragging) return;
    dragging = false;
    document.body.style.cursor = '';
    try{
      localStorage.setItem('raiseFloatPos', JSON.stringify({left:el.style.left, top:el.style.top}));
    }catch(e){}
  };
  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, {passive:false});
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive:false});
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchend', onUp);
  try{
    const saved = JSON.parse(localStorage.getItem('raiseFloatPos')||'null');
    if(saved && saved.left && saved.top){
      el.style.left = saved.left; el.style.top = saved.top;
      el.style.right = 'auto'; el.style.bottom = 'auto'; el.style.transform = 'none';
    }
  }catch(e){}
}
makeRaiseDraggable();

// ============ WebSocket ============
function connect(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}`;
  ws = new WebSocket(url);
  ws.addEventListener('open', ()=>{
    $('#connState').textContent = '已連線';
    $('#connState').className = 'conn-state ok';
  });
  ws.addEventListener('close', ()=>{
    $('#connState').textContent = '連線中斷';
    $('#connState').className = 'conn-state bad';
    setTimeout(connect, 2000);
  });
  ws.addEventListener('error', ()=>{
    $('#connState').textContent = '連線錯誤';
    $('#connState').className = 'conn-state bad';
  });
  ws.addEventListener('message', (ev)=>{
    let m;
    try { m = JSON.parse(ev.data); } catch(e){ return; }
    handleMessage(m);
  });
}
function sendWS(msg){
  if(!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify(msg));
}

function handleMessage(m){
  switch(m.type){
    case 'room-created':
      myId = m.playerId;
      roomCode = m.code;
      lobby = m.lobby;
      showWaitRoom();
      renderWaitRoom();
      break;
    case 'room-joined':
      myId = m.playerId;
      roomCode = m.code;
      lobby = m.lobby;
      showWaitRoom();
      renderWaitRoom();
      break;
    case 'spectator-joined':
      myId = null;
      roomCode = m.code;
      lobby = m.lobby;
      toast('遊戲已開始，你會以觀戰模式進入');
      showGame();
      break;
    case 'lobby-update':
      lobby = m.lobby;
      renderWaitRoom();
      break;
    case 'game-started':
      showGame();
      toast('遊戲開始！');
      updateModeBanner(m.mode, m.level, m.modeDetail);
      break;
    case 'choose-power':
      showChoosePowerModal(m.choices || [], m.deadline);
      break;
    case 'power-pick-pending':
      if(m.killerId !== myId){
        showPickPendingBanner(m.killerName || '某人', m.deadline);
      }
      break;
    case 'power-applied':
      closeChoosePowerModal();
      closePickPendingBanner();
      showPowerAppliedOverlay(m.playerName, m.power);
      if(m.power){
        showEffectToast('★ ' + m.power.icon + ' ' + m.power.name, `<strong>${m.playerName}</strong> 獲得能力`, 'purple');
      }
      break;
    case 'game-state':
      lastState = m.state;
      if(m.state.mode){
        updateModeBanner(m.state.mode, m.state.level, '');
      }
      renderTable(m.state);
      if(m.yourTurn){
        setMyTurn(m.yourTurn);
      } else {
        clearMyTurn();
      }
      break;
    case 'action-result': {
      // 視覺特效：座位上彈出 RAISE/CALL/FOLD/ALLIN + 飛籌碼
      const seat = playerSeatMap.get(m.playerId);
      if(seat){
        const a = m.action || {};
        let popType = a.type;
        let popAmt = 0;
        if(a.type === 'call'){
          // 算這個玩家比之前下注多多少
          const cur = (m.players || []).find(x=> x.id === m.playerId);
          const prev = (lastState?.players || []).find(x=> x.id === m.playerId);
          if(cur && prev) popAmt = Math.max(0, cur.bet - prev.bet);
        } else if(a.type === 'raise'){
          popAmt = a.amount || 0;
        }
        showActionPop(seat, popType, popAmt);
        if(['call','raise','allin'].includes(a.type) && popAmt > 0 || a.type === 'allin'){
          flyChipsToPot(seat, popAmt || (m.pot || 0));
        }
      }
      break;
    }
    case 'street':
      // 即時把公牌畫上去（all-in 級聯時 game-state 不會發，client 要自己更新）
      if(lastState && Array.isArray(m.community)){
        lastState.community = m.community;
        lastState.street = m.street;
        renderTable(lastState);
      }
      break;
    case 'showdown':
      handleShowdown(m.result);
      break;
    case 'triggers': {
      // 即時觸發 toast（raise/call/fold 時觸發的角色）
      (m.triggers || []).forEach((t, i)=>{
        setTimeout(()=>{
          const fromP = lastState?.players?.find(x=> x.id === t.fromId);
          const toP = lastState?.players?.find(x=> x.id === t.toId);
          let msg = '';
          if(fromP && toP) msg = `${fromP.name} → ${toP.name} <span class="et-amt">${fmt(t.amount)}</span>`;
          else if(toP) msg = `${toP.name} <span class="et-amt">+${fmt(t.amount)}</span>`;
          else msg = `<span class="et-amt">${fmt(t.amount)}</span>`;
          showEffectToast((t.icon||'✦') + ' ' + t.label, msg);
        }, i * 350);
      });
      break;
    }
    case 'blind-up':
      showBlindUp(m.level, m.sb, m.bb);
      break;
    case 'blind-tick':
      const s = Math.ceil(m.msLeft/1000);
      $('#blindTimer').textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
      break;
    case 'tournament-end':
      showEnd(m.rankings);
      break;
    case 'error':
      toast('錯誤：' + m.msg);
      break;
    case 'pong':
      break;
  }
}

function handleShowdown(r){
  // 把 reveals 的牌寫到 lastState（即使 foldOut 也試）
  if(r.reveals && lastState){
    Object.entries(r.reveals).forEach(([pid, hole])=>{
      const p = lastState.players.find(x=> x.id === pid);
      if(p) p.hole = hole;
    });
    renderTable(lastState);
  }
  if(!r.foldOut){
    // 比牌大字
    showShowdownHandName(r.handName || '');
  }

  // 標贏家 + 高亮 matched cards
  setTimeout(()=>{
    if(r.winners){
      const seats = $$('.seat');
      const map = mapToSeats(lastState);
      for(let i=0;i<6;i++){
        if(map[i] && r.winners.includes(map[i].id)){
          seats[i].classList.add('winner');
          // 加 WIN 徽章
          if(!seats[i].querySelector('.win-badge')){
            const b = document.createElement('div');
            b.className = 'win-badge';
            b.textContent = 'WIN';
            seats[i].appendChild(b);
          }
        }
      }
      if(r.matchedKeys){
        const keys = new Set(r.matchedKeys);
        markShowdownMatched(keys);
      }
    }

    // 飛籌碼到贏家
    if(r.winners && r.potWon > 0){
      r.winners.forEach(wid=>{
        const seat = playerSeatMap.get(wid);
        if(seat) flyPotToSeat(seat, Math.floor(r.potWon / r.winners.length));
      });
    }

    // 角色 / 能力觸發 toast
    if(r.triggers && r.triggers.length){
      r.triggers.forEach((t, i)=>{
        setTimeout(()=>{
          const fromP = lastState?.players?.find(x=> x.id === t.fromId);
          const toP = lastState?.players?.find(x=> x.id === t.toId);
          let msg = '';
          if(fromP && toP) msg = `${fromP.name} → ${toP.name} <span class="et-amt">${fmt(t.amount)}</span>`;
          else if(toP) msg = `${toP.name} <span class="et-amt">+${fmt(t.amount)}</span>`;
          showEffectToast((t.icon||'✦') + ' ' + t.label, msg);
        }, 1200 + i * 380);
      });
    }
  }, 200);

  // 7 秒後清掉
  setTimeout(()=>{
    $$('.seat.winner').forEach(s=> s.classList.remove('winner'));
    $$('.win-badge').forEach(b=> b.remove());
    $$('.card.showdown-matched').forEach(c=> c.classList.remove('showdown-matched'));
    $$('.card.matched').forEach(c=> c.classList.remove('matched'));
    lastMyHandType = -1;
  }, 7000);
}

function flyPotToSeat(seat, amount){
  const potEl = $('#potVal');
  if(!potEl || !seat) return;
  const seatRect = seat.getBoundingClientRect();
  const potRect = potEl.getBoundingClientRect();
  const startX = potRect.left + potRect.width/2;
  const startY = potRect.top + potRect.height/2;
  const endX = seatRect.left + seatRect.width/2;
  const endY = seatRect.top + seatRect.height/2;
  const count = Math.min(8, Math.max(3, Math.floor(Math.log10(Math.max(amount,10)))+2));
  for(let i=0;i<count;i++){
    const chip = document.createElement('div');
    chip.className = 'chip-fly';
    chip.style.left = (startX - 16 + (Math.random()-0.5)*20) + 'px';
    chip.style.top = (startY - 16 + (Math.random()-0.5)*12) + 'px';
    chip.style.opacity = '0';
    chip.style.transform = 'scale(0.4)';
    document.body.appendChild(chip);
    setTimeout(()=>{
      chip.style.opacity = '1';
      chip.style.transform = 'scale(1.1)';
    }, i*70);
    setTimeout(()=>{
      chip.style.left = (endX - 16 + (Math.random()-0.5)*30) + 'px';
      chip.style.top = (endY - 16 + (Math.random()-0.5)*16) + 'px';
      chip.style.opacity = '0.5';
      chip.style.transform = 'scale(0.7)';
    }, i*70 + 250);
    setTimeout(()=> chip.remove(), i*70 + 1100);
  }
}

function markShowdownMatched(keys){
  if(!lastState) return;
  const commEls = $('#community').children;
  for(let i=0;i<lastState.community.length;i++){
    const c = lastState.community[i];
    if(c && keys.has(c.rank + c.suit) && commEls[i]){
      commEls[i].classList.add('showdown-matched');
    }
  }
  const seats = $$('.seat');
  const map = mapToSeats(lastState);
  for(let i=0;i<6;i++){
    const p = map[i];
    if(!p || !p.hole) continue;
    const holeEls = seats[i].querySelector('.hole').children;
    p.hole.forEach((c, idx)=>{
      if(keys.has(c.rank + c.suit) && holeEls[idx]){
        holeEls[idx].classList.add('showdown-matched');
      }
    });
  }
}

function markMatchedCards(keys){
  // community
  if(!lastState) return;
  const commEls = $('#community').children;
  for(let i=0;i<lastState.community.length;i++){
    if(keys.has(lastState.community[i].rank + lastState.community[i].suit)){
      commEls[i].classList.add('matched');
    }
  }
  // 各座位的 hole
  const seats = $$('.seat');
  const map = mapToSeats(lastState);
  for(let i=0;i<6;i++){
    const p = map[i];
    if(!p || !p.hole) continue;
    const holeEls = seats[i].querySelector('.hole').children;
    p.hole.forEach((c, idx)=>{
      if(keys.has(c.rank + c.suit) && holeEls[idx]){
        holeEls[idx].classList.add('matched');
      }
    });
  }
}

// 啟動
connect();
</script>
